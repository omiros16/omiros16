# Αντέγραψε το αρχείο σε config/config.yaml και άλλαξε ό,τι χρειάζεται.
# Τα μυστικά (MT5 login, Telegram token) ΔΕΝ μπαίνουν εδώ, μπαίνουν στο .env (δες .env.example).

account:
  # ftmo_swing | ftmo_standard | e8_one | e8_signature | none
  prop_firm: ftmo_swing
  # Το μέγεθος του λογαριασμού. Τα % όρια της firm υπολογίζονται πάνω σε αυτό.
  initial_balance: 100000
  currency: USD

risk:
  risk_per_trade_pct: 0.5          # % του equity που χάνεις αν χτυπήσει το SL
  daily_loss_limit_pct: 3.0        # δικό σου όριο, ΚΑΤΩ από το 5% της FTMO
  max_drawdown_pct: 8.0            # δικό σου όριο, ΚΑΤΩ από το 10% της FTMO
  drawdown_mode: static            # static (FTMO) | trailing
  max_trade_risk_share_of_daily: 0.5   # ένα trade δεν ρισκάρει πάνω από το 50% του ημερήσιου ορίου (κανόνας E8)
  max_open_positions: 2
  max_trades_per_day: 4
  max_requests_per_day: 200        # E8: 2.000/ημέρα, μετράνε και οι αλλαγές SL/TP
  max_lots_per_ticket: null        # E8: 50
  close_before_weekend: false      # true για FTMO Standard funded / E8 Signature (το preset το ενεργοποιεί μόνο του)
  weekend_close_utc: "FRI 20:00"
  no_new_trades_after_utc: "FRI 18:00"
  day_reset_timezone: Europe/Prague   # η FTMO μηδενίζει την ημέρα στα μεσάνυχτα CE(S)T

# Στοιχεία συμβολαίου και κόστη. Στο live το bot διαβάζει τα specs από το MT5
# (python -m tradingbot check), αυτά εδώ χρησιμοποιούνται στο backtest και στο paper.
instruments:
  US100:
    broker_symbol: US100.cash      # όπως εμφανίζεται στο Market Watch του MT5
    value_per_point: 1.0           # USD ανά 1 μονάδα τιμής ανά 1 lot: ΕΛΕΓΞΕ το με `check`
    volume_min: 0.01
    volume_max: 100
    volume_step: 0.01
    digits: 2
    costs:
      spread: 1.5                  # σε μονάδες τιμής (points του δείκτη)
      slippage: 1.0
      commission_per_lot: 0.0      # ανά πλευρά
      swap_long_per_lot: -4.0      # ανά νύχτα, δες Specification στο MT5
      swap_short_per_lot: -1.0
  US500:
    broker_symbol: US500.cash
    value_per_point: 1.0
    volume_min: 0.01
    volume_max: 100
    volume_step: 0.01
    digits: 2
    costs:
      spread: 0.5
      slippage: 0.3
      commission_per_lot: 0.0
      swap_long_per_lot: -1.0
      swap_short_per_lot: -0.3

# Κάθε "slot" = μία στρατηγική σε ένα σύμβολο και timeframe, με δικό της magic number.
strategies:
  - id: us100_trend
    symbol: US100
    timeframe: D1
    strategy: trend_following
    magic: 26101101
    enabled: true
    params:
      lookbacks: [21, 63, 252]     # 1, 3, 12 μήνες
      stop_atr: 3.0
      trail_atr: 4.0
      allow_short: false
    grid:                          # τι δοκιμάζει το walk-forward (κράτα το μικρό)
      stop_atr: [2.0, 3.0, 4.0]
      trail_atr: [0, 3.0, 5.0]

  - id: us500_trend
    symbol: US500
    timeframe: D1
    strategy: trend_following
    magic: 26101102
    enabled: true
    params:
      lookbacks: [21, 63, 252]
      stop_atr: 3.0
      trail_atr: 4.0
      allow_short: false
    grid:
      stop_atr: [2.0, 3.0, 4.0]
      trail_atr: [0, 3.0, 5.0]

  - id: us100_sweep
    symbol: US100
    timeframe: H4
    strategy: quarters_sweep
    magic: 26101103
    enabled: false                 # υπόθεση προς έλεγχο, όχι για live πριν περάσει walk-forward
    params:
      quarter_size: 250            # 1000-point εύρος / 4
      level_source: both
      swing_strength: 3
      trend_ma: 200
      rr: 2.0
      max_bars: 20
    grid:
      rr: [1.5, 2.0, 3.0]
      level_source: [quarters, swings, both]

walkforward:
  in_sample_bars: 1000
  out_sample_bars: 250
  objective: sharpe                # sharpe | calmar | net_profit
  min_trades: 5

broker:
  type: paper                      # paper (προσομοίωση) | mt5 (πραγματικές εντολές στο συνδεδεμένο account)
  deviation_points: 20
  filling: auto                    # auto | fok | ioc | return

mt5:
  path: null                       # π.χ. "C:/Program Files/FTMO MetaTrader 5/terminal64.exe"

runtime:
  poll_seconds: 30
  state_dir: state
  log_dir: logs
  kill_switch_file: KILL_SWITCH    # αν δημιουργηθεί αυτό το αρχείο: κλείνει τα πάντα και σταματάει
  heartbeat_hour_utc: 21           # ώρα της ημερήσιας αναφοράς στο Telegram

alerts:
  telegram: true
  prefix: "[bot] "
