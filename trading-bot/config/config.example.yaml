# Αντέγραψε το αρχείο σε config/config.yaml και άλλαξε ό,τι χρειάζεται.
# Τα μυστικά (MT5 login, Telegram token) ΔΕΝ μπαίνουν εδώ, μπαίνουν στο .env (δες .env.example).

account:
  # ftmo_swing | ftmo_standard | e8_one | e8_signature | none
  prop_firm: ftmo_swing
  # Το μέγεθος του λογαριασμού. Τα % όρια της firm υπολογίζονται πάνω σε αυτό.
  initial_balance: 100000
  currency: USD

risk:
  risk_per_trade_pct: 0.5          # % του equity που χάνεις αν χτυπήσει το SL
  # Το δικό σου ημερήσιο όριο, ΚΑΤΩ από το 5% της FTMO. Μετριέται από το max(balance, equity) στην
  # αρχή της ημέρας, άρα κόβει και τη ζημιά που κουβαλάει η θέση από χθες (δες RESEARCH.md §5).
  daily_loss_limit_pct: 3.0
  # Οριστική διακοπή. Challenge: 9.5 (στο -9.5% το challenge έχει ούτως ή άλλως χαθεί).
  # Funded: 9.0, για περιθώριο από το 10% της FTMO.
  max_drawdown_pct: 9.5
  drawdown_mode: static            # static (FTMO) | trailing
  max_trade_risk_share_of_daily: 0.5   # ένα trade δεν ρισκάρει πάνω από το 50% του ημερήσιου ορίου (κανόνας E8)
  max_open_positions: 10            # το mr_ensemble μπορεί να χρησιμοποιεί πολλά tickets
  max_trades_per_day: 4
  max_requests_per_day: 200        # E8: 2.000/ημέρα, μετράνε και οι αλλαγές SL/TP
  max_lots_per_ticket: null        # E8: 50
  max_exposure: 3.0                # ανώτατη θέση = 3x equity (notional) για στρατηγικές έκθεσης
  close_before_weekend: false      # true για FTMO Standard funded / E8 Signature (το preset το ενεργοποιεί μόνο του)
  # Ώρες UTC. Αν η Παρασκευή είναι αργία στις ΗΠΑ (π.χ. Μεγάλη Παρασκευή), ισχύουν την Πέμπτη.
  # 16:30 UTC: πριν από τα πρόωρα κλεισίματα (μετά την Ημέρα των Ευχαριστιών, παραμονή Χριστουγέννων).
  weekend_close_utc: "FRI 16:30"
  no_new_trades_after_utc: "FRI 16:00"
  weekend_reopen_utc: "SUN 21:00"  # από εδώ και πέρα επιτρέπονται ξανά νέες θέσεις
  day_reset_timezone: Europe/Prague   # η FTMO μηδενίζει την ημέρα στα μεσάνυχτα CE(S)T

# Στοιχεία συμβολαίου και κόστη. Στο live το bot διαβάζει τα specs από το MT5
# (python -m tradingbot check), αυτά εδώ χρησιμοποιούνται στο backtest και στο paper.
instruments:
  US100:
    broker_symbol: US100.cash      # όπως στο Market Watch του MT5 (FTMO από 2/2026: μπορεί να είναι US100.sim)
    value_per_point: 1.0           # USD ανά 1 μονάδα τιμής ανά 1 lot: ΕΛΕΓΞΕ το με `check`
    volume_min: 0.01
    volume_max: 100
    volume_step: 0.01
    digits: 2
    # Ιστορικό για το warm-up όταν ο broker δίνει λιγότερα D1 bars απ' όσα χρειάζεται η
    # στρατηγική (το mr_ensemble θέλει 514). Δες README, "Ιστορικό". Π.χ.:
    # history_csv: data/US100_D1_NQ_2019_2026.csv
    costs:
      # Κόστη ως ποσοστό της τιμής, ώστε το backtest να είναι σωστό και σε παλιά
      # δεδομένα (1.7 points είναι 0.7 bp στις 24.000 αλλά 17 bp στις 1.000).
      spread_bp: 1.0               # 1 bp = 0,01% της τιμής (~2,4 points στις 24.000)
      slippage_bp: 0.5             # ανά εκτέλεση: round trip = spread + 2 x slippage = 2 bp (όπως στην έρευνα)
      commission_per_lot: 0.0      # FTMO: μηδενικό commission στα indices
      swap_long_pct: -6.0          # ετήσιο % της αξίας της θέσης (/360 ανά νύχτα): επιτόκιο + markup. Δες Specification στο MT5
      swap_short_pct: -1.0
  US500:
    broker_symbol: US500.cash      # ή US500.sim
    value_per_point: 1.0
    volume_min: 0.01
    volume_max: 100
    volume_step: 0.01
    digits: 2
    costs:
      spread_bp: 1.0
      slippage_bp: 0.5
      commission_per_lot: 0.0
      swap_long_pct: -6.0
      swap_short_pct: -1.0

# Κάθε "slot" = μία στρατηγική σε ένα σύμβολο και timeframe, με δικό της magic number.
# Η έρευνα (RESEARCH.md) βρήκε edge ΜΟΝΟ στο mr_ensemble. Οι άλλες δύο
# στρατηγικές μένουν για σύγκριση, απενεργοποιημένες.
strategies:
  - id: us100_mr
    symbol: US100
    timeframe: D1                  # αποφασίζει στο κλείσιμο του ημερήσιου bar, εκτελεί στο επόμενο άνοιγμα
    strategy: mr_ensemble
    magic: 26101104
    enabled: true
    params:
      leverage: 1.5                # challenge: 1.5 (ή 1.25 για λιγότερες αποτυχίες). Funded: 1.0. Δες RESEARCH.md §5
      vol_target: 0.15
      vol_cap: 2.0
      regime_max_autocorr: 0.10    # φρένο ασφαλείας: σταματάει αν η αγορά πάψει να κάνει mean reversion
      min_change: 0.02             # αλλάζει μέγεθος μόνο αν η διαφορά είναι >= 2% του equity

  - id: us500_mr
    symbol: US500
    timeframe: D1
    strategy: mr_ensemble
    magic: 26101105
    enabled: false                 # 0.90 συσχέτιση με το US100: ή το ένα ή το άλλο (ή και τα δύο με leverage μισό)
    params:
      leverage: 1.5

  - id: us100_trend
    symbol: US100
    timeframe: D1
    strategy: trend_following
    magic: 26101101
    enabled: false                 # έρευνα: ~0 μετά από swaps (H1/H2)
    params:
      lookbacks: [21, 63, 252]
      stop_atr: 3.0
      trail_atr: 4.0
      allow_short: false
    grid:
      stop_atr: [2.0, 3.0, 4.0]
      trail_atr: [0, 3.0, 5.0]

  - id: us100_sweep
    symbol: US100
    timeframe: H4
    strategy: quarters_sweep
    magic: 26101103
    enabled: false                 # έρευνα: χωρίς edge σε ημερήσια (H13)
    params:
      quarter_size: 250
      level_source: both
      swing_strength: 3
      trend_ma: 200
      rr: 2.0
      max_bars: 20

walkforward:
  in_sample_bars: 1000
  out_sample_bars: 250
  objective: sharpe                # sharpe | calmar | net_profit
  min_trades: 5

broker:
  type: paper                      # paper (προσομοίωση) | mt5 (πραγματικές εντολές στο συνδεδεμένο account)
  deviation_points: 20
  filling: auto                    # auto | fok | ioc | return
  # Με type: mt5 το bot στέλνει εντολές μόνο αν το επιβεβαιώσεις: εδώ (true) ή με --allow-orders.
  # Βάλε true όταν το τρέχεις χωρίς επίβλεψη (Task Scheduler), αλλιώς μετά από restart δεν ξεκινάει.
  allow_orders: false

mt5:
  path: null                       # π.χ. "C:/Program Files/FTMO MetaTrader 5/terminal64.exe"

runtime:
  poll_seconds: 30
  state_dir: state
  log_dir: logs
  kill_switch_file: KILL_SWITCH    # αν δημιουργηθεί αυτό το αρχείο: κλείνει τα πάντα και σταματάει
  heartbeat_hour_utc: 21           # ώρα της ημερήσιας αναφοράς στο Telegram

alerts:
  telegram: true
  prefix: "[bot] "
