# Football analysis app: rebuilds the data twice a week (after the weekend and before it)
# and publishes the app with GitHub Pages. Each run replaces the data, nothing accumulates.
name: football-data
on:
  schedule:
    - cron: '17 4 * * 2,5'   # Tuesday and Friday, 04:17 UTC
  workflow_dispatch:
  push:
    branches: [claude/football-betting-analysis-app-vpdjbp]
    paths: ['football/**', '!football/data/**', '.github/workflows/football.yml']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: football-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Model tests
        run: node football/test/model.test.mjs
      - name: Download and fit data
        env:
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node football/scripts/update.mjs football/data
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r football/index.html football/manifest.webmanifest football/sw.js football/icon.svg football/css football/js football/data _site/
          du -sh _site _site/data
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # Development only: keep a data snapshot on the work branch for local testing.
      - name: Commit data snapshot (dev branch)
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f football/data
          git commit -qm "Data snapshot" && git push || echo "no changes"

  deploy:
    if: github.ref_name == github.event.repository.default_branch
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
